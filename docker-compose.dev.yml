# KAIROS-HIMS/docker-compose.yml

services:
  # 1. Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: dev_hims_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: kairos_hims
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kairos_network

  # 2. Backend Service
  backend:
    build: ./backend # Tells Docker to look for the Dockerfile in the backend folder
    container_name: dev_hims_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      # We use the container name 'postgres_db' instead of 'localhost'
      DATABASE_URL: "postgresql://postgres:rootpassword@postgres_db:5432/kairos_hims?schema=public"
      PORT: 5000
      JWT_SECRET: "kairos_hims_super_secret_key_2026"
      JWT_EXPIRES_IN: "24h"
    depends_on:
      - postgres_db # Ensures DB starts before the backend
    networks:
      - kairos_network

  # 3. Frontend Service
  frontend:
    build: ./frontend # Tells Docker to look for the Dockerfile in the frontend folder
    container_name: dev_hims_frontend
    restart: always
    ports:
      - "8081:80" # Maps port 80 of your laptop to port 80 of NGINX
    depends_on:
      - backend
    networks:
      - kairos_network

# Define persistent storage for the database
volumes:
  postgres_data:

# Define a custom network so containers can talk to each other
networks:
  kairos_network:
    driver: bridge
